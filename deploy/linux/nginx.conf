server {
    listen 18488 ssl;
    server_name 203.0.113.10;
    ssl_certificate /etc/letsencrypt/live/203.0.113.10/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/203.0.113.10/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DeskGradeTLS:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 12m;
    client_body_timeout 30s;
    access_log /var/log/nginx/deskgrade-access.log;
    error_log /var/log/nginx/deskgrade-error.log warn;

    location = / {
        return 302 /admin;
    }
    # Optional static test deployments are separate from the commercial gateway.
    include /etc/deskgrade/nginx-static-sites/*.conf;

    location /downloads/ {
        alias /opt/deskgrade/downloads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header X-Forwarded-Host 203.0.113.10:18488;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 660s;
        proxy_buffering off;
    }
}
