/var/log/nginx/deskgrade-access.log /var/log/nginx/deskgrade-error.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        /www/server/nginx/sbin/nginx -s reopen -c /www/server/nginx/conf/nginx.conf >/dev/null 2>&1 || true
    endscript
}
/var/log/deskgrade-backup.log {
    weekly
    rotate 8
    missingok
    notifempty
    compress
    copytruncate
}
